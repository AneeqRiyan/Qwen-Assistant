assistant:
  name: "GWEN"                            # Changeable — used in system prompt & future wake-word

hardware:
  device: "cpu"                            # "cpu" | "cuda" — flip for GPU migration

llm:
  model_name: "qwen3.5:2b"
  ollama_base_url: "http://localhost:11434"
  temperature: 0.7
  context_window_turns: 10                 # Last N turns sent to LLM

stt:
  engine: "faster-whisper"                 # "faster-whisper"
  model_size: "base.en"                    # "tiny.en" | "base.en" | "small.en" | "medium.en"

tts:
  engine: "piper"                          # "piper" | "pyttsx3" (fallback)
  voice: "en_US-lessac-medium"             # Piper voice model name

weather:
  provider: "open-meteo"                   # "open-meteo" | "wttr-in"
  units:
    temperature: "celsius"                 # "celsius" | "fahrenheit"

calendar:
  provider: "sqlite"                       # "sqlite" | "google" (Phase 2)

locale:
  timezone: "Europe/Berlin"

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

logging:
  level: "INFO"                            # "DEBUG" | "INFO" | "WARNING" | "ERROR"
  file: "logs/assistant.log"
  max_days: 7
